# Dependabot configuration for Tessera.
#
# Schedules version updates for Gradle dependencies and GitHub Actions.
# Security updates are enabled separately via the GitHub UI
# (Settings → Code security and analysis → Dependabot security updates)
# and use this file's `package-ecosystem` entries for routing.
#
# See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Gradle / Kotlin dependencies (build.gradle.kts + libs.versions.toml).
  # Version-update PRs are OFF (limit 0): versions move only at the six-monthly
  # dependency cadence (.claude/skills/dependency-upgrade-cadence/SKILL.md). Security
  # updates are a separate repo setting and are not subject to this limit - an alert
  # with a fix still gets its PR at once (TES-148). The schedule block is required
  # by the schema even with the limit at zero.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions workflow versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      # Actions bumps are CI-only, never consumer-facing — pre-satisfies the
      # changelog gate (.github/workflows/changelog.yml). Gradle bumps above
      # deliberately do NOT get this: they can affect the shipped SDK, so the
      # changelog decision stays per-PR.
      - no-changelog
    # One grouped PR per cycle instead of one PR per action: under strict
    # branch protection, N separate PRs cost N sequential CI cycles (each
    # merge puts the rest BEHIND). Batching was done by hand for #188–#192
    # (→ #194); this makes Dependabot do it at the source.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
