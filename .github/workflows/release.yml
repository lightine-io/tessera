# Release pipeline — builds and publishes Tessera on a version tag.
#
# Triggers:
#   - push of a `v*` tag → the real release (publishes).
#   - workflow_dispatch  → a dry-run (builds/packages only; no secrets, publishes nothing),
#                          used to validate the pipeline before a real tag.
#
# One macOS runner does everything: only macOS can build the iOS XCFramework (Kotlin/Native links
# against Xcode), and it can also run the JVM/Android Maven publish. (When a non-Apple channel like
# web/npm is added, split that off to a Linux job — see the project's issue tracker.)
#
# Channels:
#   - JVM + Android → Maven Central, STAGED (automaticRelease=false, ADR-016): the workflow uploads a
#     staged deployment; a maintainer clicks "release" in the Sonatype Central portal to go live.
#     The publish step waits for Central's validation and fails if Central rejects the deployment
#     (validateDeployment = VALIDATED in the root build.gradle.kts, TES-236).
#   - iOS → SPM: the `Tessera` XCFramework is built, zipped, and attached to this repo's GitHub Release;
#     iOS consumers get it via lightine-io/tessera-swift (ADR-019). The tessera-swift Package.swift
#     (binaryTarget url + checksum) and its matching release tag are then updated AUTOMATICALLY by the
#     "Publish to tessera-swift (SPM)" steps below, using a least-privilege GitHub App installation
#     token (TES-14) — fully within tessera-swift's signed-commit / PR-required / immutable-tag rulesets.
#
# Every action is pinned to a full commit SHA with a version comment (supply-chain hardening),
# matching .github/workflows/check.yml.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + package only; publishes nothing, needs no secrets"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Xcode is pinned, not "whatever the image ships". The Kotlin Multiplatform compatibility table lists
# Xcode 26.4 for Kotlin 2.4.20-2.4.21 (https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html);
# macos-26 carries Xcode_26.4.1.app (https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md).
# Bump it with the Kotlin version, in the dependency cadence.
env:
  XCODE_VERSION: "26.4.1"

jobs:
  # Real release — only on a `v*` tag. Runs under the protected `release` environment: its required
  # reviewer is the manual go/no-go gate, and the signing + Sonatype secrets unlock only after that
  # approval (the environment + secrets are configured in repo settings before the first real tag).
  release:
    name: release · publish
    if: github.event_name == 'push'
    runs-on: macos-26
    environment: release
    permissions:
      contents: write # create the GitHub Release and upload the XCFramework asset
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag must match the build version, or Central gets the wrong version and only the Swift
      # package ships (TES-236). Runs before any publish.
      - name: Tag matches the build version
        run: |
          TAG="${GITHUB_REF_NAME}"
          BUILD=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v${BUILD}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} but gradle.properties says version=${BUILD}. Bump the version, then tag."
            exit 1
          fi
          echo "Tag ${TAG} matches version=${BUILD}"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XC="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XC" ]; then
            echo "::error::$XC is missing on this runner image; no fallback to another Xcode."
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The Android camera modules (tessera-mrz-camera, tessera-mrz-camera-ui and their -android AARs)
      # publish here, so the macOS runner needs the compileSdk platform. macos-26 ships the Android SDK; ensure android-37.0 is present.
      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Publish to Maven Central (staged)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral

      - name: Build the Tessera XCFramework
        run: ./gradlew :mrz-camera-ios:packTesseraXCFramework

      - name: Compute SPM checksum
        id: checksum
        run: |
          ZIP="mrz-camera-ios/build/distributions/Tessera.xcframework.zip"
          SUM=$(swift package compute-checksum "$ZIP")
          echo "checksum=$SUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload XCFramework
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ZIP="mrz-camera-ios/build/distributions/Tessera.xcframework.zip"
          # Consumer-facing notes: install blocks + this version's CHANGELOG section (the
          # Keep-a-Changelog discipline guarantees the section exists at tag time) + the SPM
          # checksum, which stays in the release body as the independent second authenticity
          # channel (ADR-019). Earlier releases generated checksum-only notes — that read as
          # an empty release to consumers evaluating the project.
          {
            echo "## Tessera $TAG"
            echo
            echo "### Install"
            echo
            echo '**Gradle (Kotlin DSL):**'
            echo '```kotlin'
            echo "implementation(platform(\"io.lightine.tessera:tessera-bom:$VERSION\"))"
            echo 'implementation("io.lightine.tessera:tessera-mrz-core")            // parse / validate / generate'
            echo 'implementation("io.lightine.tessera:tessera-mrz-camera")          // Android live-camera scanning'
            echo '```'
            echo
            echo "**iOS (Swift Package Manager):** add \`https://github.com/lightine-io/tessera-swift\` in Xcode and select \`$TAG\`."
            echo
            echo "### What's in this release"
            echo
            # index(...) == 1 anchors the match to the exact heading prefix, so e.g. tag 0.2.1
            # can never match a future "## [0.2.10]" heading by substring.
            awk -v ver="## [$VERSION] " '
              /^## \[/ { inblock = index($0, ver) == 1; next }
              inblock  { print }
            ' CHANGELOG.md
            echo
            echo "\`Tessera.xcframework.zip\` SHA-256 checksum (for the SPM \`binaryTarget\` — the independent second authenticity channel):"
            echo
            echo '```'
            echo "$CHECKSUM"
            echo '```'
          } > release-notes.md
          # Re-run-safe: create the release if it doesn't exist yet; otherwise refresh its asset + notes
          # (so a re-run after a partial failure doesn't error on an already-existing release).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      # --- TES-14: automated cross-repo SPM publish into lightine-io/tessera-swift ---
      # Updates the binaryTarget (url + checksum) in Package.swift and cuts the matching release tag,
      # fully within tessera-swift's rulesets (signed commits, PR-required/0-approvals, immutable tags)
      # via a least-privilege GitHub App token. API-authored commits are GitHub-signed, so no signing
      # key is needed in CI. Idempotent / re-run-safe; never moves an existing tag. The flow was proven
      # end-to-end against a replica before first use (TES-14). If this fails, the Maven + GitHub Release
      # above still stand — fall back to a manual Package.swift bump, or just re-run.
      - name: Mint tessera-swift App token
        id: spm_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SPM_PUBLISH_APP_ID }}
          private-key: ${{ secrets.SPM_PUBLISH_APP_PRIVATE_KEY }}
          owner: lightine-io
          repositories: tessera-swift

      - name: Publish to tessera-swift (SPM)
        env:
          GH_TOKEN: ${{ steps.spm_token.outputs.token }}
          TAG: ${{ github.ref_name }}
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          set -euo pipefail
          REPO="lightine-io/tessera-swift"
          BRANCH="release/${TAG}"

          # Idempotency: tags are immutable. If the tag already exists, this release is fully published.
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${REPO} ${TAG} already published; nothing to do."; exit 0
          fi

          # TES-138 ordering gate: the tag is cut from tessera-swift's main head, so every release-bound
          # change must already be merged there. At v0.5.0 the UI PR merged after this step ran and the
          # tag silently excluded it. Any open PR other than our own pin branch stops the publish; merge
          # (or close) it, then re-run this job — the guards above and below make the re-run safe.
          OPEN=$(gh pr list --repo "${REPO}" --state open --json number,headRefName \
                   --jq "[.[] | select(.headRefName != \"${BRANCH}\")] | map(\"#\\(.number) (\\(.headRefName))\") | join(\", \")")
          if [ -n "${OPEN}" ]; then
            echo "::error::${REPO} has open PRs that would be excluded from tag ${TAG}: ${OPEN}. Merge or close them, then re-run this job."
            exit 1
          fi

          # Partial-rerun guard: if a prior run already merged Package.swift but did not tag, tag only.
          CUR=$(gh api "repos/${REPO}/contents/Package.swift" --jq '.content' | base64 -d)
          if printf '%s' "${CUR}" | grep -q "releases/download/${TAG}/Tessera.xcframework.zip"; then
            echo "::notice::Package.swift already at ${TAG} on main; tagging only."
            MERGE=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${MERGE}" >/dev/null
            echo "::notice::Tagged ${REPO} ${TAG}."; exit 0
          fi

          # Render the new Package.swift: swap only the download URL's version and the checksum.
          NEW=$(printf '%s' "${CUR}" \
            | sed -E "s#(releases/download/)v[0-9][^/]*(/Tessera\.xcframework\.zip)#\1${TAG}\2#" \
            | sed -E "s#(checksum: \")[a-f0-9]{64}(\")#\1${CHECKSUM}\2#")

          # Branch off the current default-branch head (reset a stale branch if a prior run left one).
          BASE=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')
          gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${BASE}" >/dev/null 2>&1 \
            || gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="${BASE}" -F force=true >/dev/null

          # Signed commit via createCommitOnBranch (GitHub signs API-authored commits — no key in CI).
          HEAD=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha')
          NB64=$(printf '%s' "${NEW}" | base64 | tr -d '\n')
          PAYLOAD=$(jq -n \
            --arg repo "${REPO}" --arg branch "${BRANCH}" --arg head "${HEAD}" \
            --arg msg "chore(release): Tessera ${TAG} XCFramework (url + checksum)" \
            --arg contents "${NB64}" \
            '{query:"mutation($i: CreateCommitOnBranchInput!){createCommitOnBranch(input:$i){commit{oid}}}",
              variables:{i:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},
              expectedHeadOid:$head,message:{headline:$msg},
              fileChanges:{additions:[{path:"Package.swift",contents:$contents}]}}}}')
          RESP=$(curl -sf https://api.github.com/graphql -H "Authorization: bearer ${GH_TOKEN}" -d "${PAYLOAD}")
          echo "${RESP}" | jq -e '.data.createCommitOnBranch.commit.oid' >/dev/null \
            || { echo "::error::createCommitOnBranch failed: ${RESP}"; exit 1; }

          # PR is required by the ruleset (0 approvals). Reuse our pin PR if a prior run left one open.
          PR=$(gh pr list --repo "${REPO}" --state open --head "${BRANCH}" --json url --jq '.[0].url // empty')
          if [ -z "${PR}" ]; then
            PR=$(gh pr create --repo "${REPO}" --base main --head "${BRANCH}" \
                   --title "chore(release): Tessera ${TAG} XCFramework" \
                   --body "Automated by lightine-io/tessera release ${TAG}. Updates binaryTarget url + checksum.")
          fi

          # TES-218 check gate: never merge or tag a pin that breaks the Swift package. The pin PR's CI
          # builds and tests TesseraUI against the NEW XCFramework (the pin URL is the asset uploaded
          # above). Fail closed: no checks appearing, a failing check, or a timeout stops the job
          # before the merge and the tag. The PR stays open; fix the cause and re-run (the guards
          # above reuse the PR and reset the branch).
          # Poll (macOS runners have no `timeout`; gh exits 0 = all passed, 8 = pending, 1 = failed;
          # right after the PR opens it may report no checks yet, which also exits non-zero).
          DEADLINE=$((SECONDS + 3000)); SEEN=""; RC=1
          while [ "${SECONDS}" -lt "${DEADLINE}" ]; do
            RC=0; OUT=$(gh pr checks "${PR}" --repo "${REPO}" 2>&1) || RC=$?
            [ "${RC}" -eq 0 ] && break
            case "${OUT}" in *"no checks reported"*) ;; *) SEEN=1 ;; esac
            [ "${RC}" -eq 1 ] && [ -n "${SEEN}" ] && { echo "${OUT}"; break; }
            # Never saw a check within 5 min: fail closed rather than merge unchecked.
            [ -z "${SEEN}" ] && [ "${SECONDS}" -gt $((DEADLINE - 2700)) ] && { echo "${OUT}"; RC=1; break; }
            sleep 30
          done
          if [ "${RC}" -ne 0 ]; then
            echo "::error::${REPO} checks on ${PR} did not pass (failed, never reported, or timed out after 50 min). Not merging, not tagging ${TAG}. Fix tessera-swift, then re-run this job."
            exit 1
          fi
          gh pr merge "${PR}" --repo "${REPO}" --merge --delete-branch

          # Tag the merge commit (lightweight; verified via its signed anchor — satisfies the tag ruleset).
          MERGE=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')
          gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${MERGE}" >/dev/null
          echo "::notice::Published ${REPO} ${TAG} (Package.swift + tag)."

  # Dry-run — manual only. Validates the pipeline WITHOUT publishing: no environment, no secrets, no
  # release. Proves the build/package/checksum path and that the publish task graph resolves.
  dry-run:
    name: release · dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XC="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XC" ]; then
            echo "::error::$XC is missing on this runner image; no fallback to another Xcode."
            exit 1
          fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Validate publish task graph (no upload, no secrets)
        run: ./gradlew publishToMavenCentral --dry-run

      - name: Build the Tessera XCFramework
        run: ./gradlew :mrz-camera-ios:packTesseraXCFramework

      - name: Compute SPM checksum (sanity)
        run: |
          ZIP="mrz-camera-ios/build/distributions/Tessera.xcframework.zip"
          swift package compute-checksum "$ZIP"
