# Submits the full resolved Gradle dependency graph - including transitive
# dependencies - to GitHub's Dependency Graph. GitHub cannot resolve a Gradle
# project's transitive graph on its own, so without this submission Dependabot
# alerts see only the directly-declared dependencies. With it, the whole tree is
# enumerated for CVE alerting - the continuous half of the dependency CVE scan
# (the project's issue tracker "CI and repository hardening", item 5 / action-plan
# A4 / Q6).
#
# Runs on push to main only, which keeps the baseline graph current so Dependabot
# alerts cover the full transitive set. There is no PR-time gate: the PR-level
# dependency-review check was removed (TES-147) because GitHub's snapshot
# visibility lag made it pass vacuously. Vulnerable dependencies are caught after
# merge by Dependabot alerts and before every release by the release gate's
# open-alert check (see SECURITY.md).
#
# First-party actions only (GitHub + Gradle Foundation), matching check.yml's
# supply-chain stance — no third-party scanner enters the build.

name: dependency submission

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-submission:
    name: dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21 to match check.yml; the Gradle daemon still pins to JDK 17
      # (gradle/gradle-daemon-jvm.properties, foojay-provisioned).
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Resolving the graph configures the Android modules, which read compileSdk 37 (android-37.0,
      # Android 17 — see check.yml). android-37.0 is recent (GA 2026-06-16) and may not be preinstalled,
      # so ensure it explicitly (with license acceptance) rather than relying on AGP auto-download, which
      # could hang on an unaccepted-license prompt in CI. Same first-party-sdkmanager approach as check.yml.
      - name: Ensure Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-37.0"
          fi

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Alert only on what actually SHIPS - keep build-time/test-only dependencies out of the submitted
          # graph so Dependabot never raises alerts for transitives that cannot reach a consumer:
          #   - `.*[Tt]est(Compile|Runtime)Classpath` - per-target test classpaths (e.g. Robolectric, which
          #     pulls bcprov). These are project configurations, so exclude-configurations reaches them.
          # The build-time *buildscript* classpath (e.g. Dokka's jackson) is kept out at the source - by
          # NOT declaring a root `buildscript {}` block; the buildscript classpath is not a project
          # configuration, so it cannot be excluded here. Result: the submitted graph covers the
          # runtime/compile classpaths of the published artifacts only, so consumer-facing dependency
          # CVEs are still alerted.
          dependency-graph-exclude-configurations: '.*[Tt]est(Compile|Runtime)Classpath'
