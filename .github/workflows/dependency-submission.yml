# Submits the full resolved Gradle dependency graph — including transitive
# dependencies — to GitHub's Dependency Graph. GitHub cannot resolve a Gradle
# project's transitive graph on its own, so without this submission Dependabot
# alerts and the PR gate (dependency-review.yml) see only the directly-declared
# dependencies. With it, the whole tree is enumerated for CVE alerting — the
# continuous half of the dependency CVE scan (the project's issue tracker "CI and
# repository hardening", item 5 / action-plan A4 / Q6).
#
# Runs on push to main (keeps the baseline graph current, so Dependabot alerts
# cover the full transitive set) and on pull_request (so dependency-review can
# diff the PR's full graph — that job waits for this submission via
# retry-on-snapshot-warnings).
#
# Pattern 1 (trusted / same-repo PRs) per the gradle/actions docs: submit
# directly on pull_request. Tessera's PRs are same-repo branches, for which
# `contents: write` is available; for a fork PR on this public repo GitHub
# auto-downgrades the token to read, so the submit step simply no-ops rather
# than escalating privilege. If external fork PRs ever become routine, switch to
# the fork-safe generate-and-upload + workflow_run pattern (Pattern 2 in those
# docs).
#
# First-party actions only (GitHub + Gradle Foundation), matching check.yml's
# supply-chain stance — no third-party scanner enters the build.

name: dependency submission

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-submission:
    name: dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # JDK 21 to match check.yml; the Gradle daemon still pins to JDK 17
      # (gradle/gradle-daemon-jvm.properties, foojay-provisioned). The Android
      # modules configure against the runner's preinstalled android-36 platform
      # (compileSdk 36), so no SDK install step is needed here for resolution.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
