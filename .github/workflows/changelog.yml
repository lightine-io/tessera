# Enforces the CHANGELOG rule (CLAUDE.md "The Work Loop", step 4): a PR touches CHANGELOG.md
# [Unreleased], or carries the `no-changelog` label because nothing ships (state why in the PR
# description). The same label moves the board issue straight to Done at merge
# (youtrack-sync.yml), so every merged PR is exactly one of: shipped change or no artifact.
#
# Separate workflow (not a job in check.yml) on purpose: it re-runs on label add/remove
# (`labeled`/`unlabeled` types) without re-running the build matrix; the macOS job in
# check.yml would otherwise re-run on every label change.
#
# Action pinned to a full commit SHA per the repo convention (see check.yml header).

name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: changelog · entry present
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry (or the no-changelog label)
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md touched: ok"
          else
            echo "::error::This PR does not touch CHANGELOG.md. Add an [Unreleased] entry, or apply the 'no-changelog' label when nothing ships and say why in the PR description (.claude/git-workflow.md)."
            exit 1
          fi
