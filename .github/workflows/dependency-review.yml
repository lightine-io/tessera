# Blocks a pull request that introduces a dependency with a known vulnerability
# (CVE) at or above the severity threshold, and surfaces license information in
# the PR. This is the PR *gate* half of the dependency CVE scan (the project's issue tracker
# "CI and repository hardening", item 5 / action-plan A4 / Q6); the continuous
# full-graph alerting half is Dependabot, fed by dependency-submission.yml.
#
# A Gradle project's PR graph must be *submitted* for the review to diff it
# (GitHub can't resolve it natively), so this job waits for dependency-submission
# to finish via retry-on-snapshot-warnings (up to 600s). On the very first PR —
# the one that adds these workflows — main has no submitted baseline graph yet,
# so the diff is trivial; once merged, push-to-main submits the baseline and
# subsequent PRs diff properly.
#
# License GATING (allow-licenses) is intentionally not set yet: an incomplete
# allow-list would fail legitimate Apache-2.0 / MIT dependencies. Licenses are
# surfaced in the PR summary now; a curated allow-list can tighten this once the
# transitive license set is enumerated (a deliberate deferral — see the
# issue-tracker item-5 update).
#
# First-party (GitHub) action only — consistent with check.yml's stance.

name: dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # for comment-summary-in-pr: on-failure

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency review
        # All actions are pinned to a commit SHA with a version comment (supply-chain
        # hardening, issue-tracker item 3); Dependabot's github-actions updates bump
        # both the SHA and the comment. The comment here also records that
        # dependency-review-action publishes no moving `v5` major tag — only point
        # releases like v5.0.0 — unlike checkout/setup-java.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Gate on moderate-or-higher CVEs (low is mostly unfixable transitive noise).
          fail-on-severity: moderate
          # Test-only allowlist. Both advisories are against org.bouncycastle:bcprov-jdk18on, which
          # enters the graph ONLY as a transitive of Robolectric (mrz-camera-ui-android's androidHostTest
          # harness): verified present only on androidHostTest{Compile,Runtime}Classpath and ABSENT from
          # every shipped/runtime classpath (androidReleaseRuntimeClasspath etc.), so it is not in any
          # published artifact and never on a consumer's classpath. The vulnerable GOST/LDAP code paths
          # are not exercised by Robolectric and run only in CI/local test JVMs — build-time only. The
          # Gradle dependency-submission reports it as runtime scope, so fail-on-scopes cannot distinguish
          # it; these two GHSAs are allowlisted instead. REVISIT if BouncyCastle ever becomes a *shipped*
          # (runtime) dependency — e.g. NFC/eMRTD crypto at 0.6.0 — then remove these so it is gated again.
          # Tracked in the issue tracker (bcprov test-only triage).
          #   GHSA-574f-3g2m-x479  bcprov GOST 28147 CTR keystream reuse (critical)
          #   GHSA-c3fc-8qff-9hwx  bcprov LDAP injection (moderate)
          allow-ghsas: GHSA-574f-3g2m-x479, GHSA-c3fc-8qff-9hwx
          # Wait for dependency-submission.yml to submit the PR's Gradle graph.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 600
          # Comment the summary only when the gate fails, to keep clean PRs quiet.
          comment-summary-in-pr: on-failure
