# Continuous integration: runs `./gradlew check` on every PR to main and on
# every push to main. This workflow exists so the branch-protection rule
# "Require status checks to pass before merging" has something meaningful to
# wait on.
#
# Scope:
# - The `check` job runs the JVM `check` only — it does not compile the mobile
#   targets. `gradle check` excludes the Android target (which compiles via
#   `assemble`/`compileAndroidMain`, not `check`) and the iOS targets (which need
#   a macOS runner with Xcode — a Linux runner cannot build Apple targets at all).
# - The `android-compile` job (added at 0.2.0's mrz-camera-android slice) compiles
#   every module's Android target on a Linux runner with the Android SDK, so the
#   ML Kit / CameraX code in androidMain is type-checked on CI. It also runs
#   mrz-camera-android's androidHostTest unit tests (that module is Android-only, with
#   no jvm target to carry them in the `check` job). Still no emulator, no instrumented
#   tests, no live camera (those run locally / on a device).
# - The `ios-compile` job (added at 0.2.0's mrz-camera-ios slice) compiles every
#   module's iOS targets on a macOS runner — the only runner that can build Apple
#   targets — and runs the iosSimulatorArm64 host tests. It type-checks the
#   commonMain/iosMain code (the core modules' iOS targets and, from the iOS camera
#   slice, the AVFoundation/Vision code) that the Linux jobs cannot. Device/live-camera
#   runs are local/manual; the Simulator has no camera.
# - JS / Wasm remain per-release-activated per docs/scope.md "Supported Platforms".
# - JDK 21 to match each module's jvmToolchain(21); the Gradle daemon is pinned to
#   JDK 17 (gradle/gradle-daemon-jvm.properties, foojay-provisioned).
# - Gradle 9.5.1 via the project's wrapper
# - Every action is pinned to a full commit SHA with a trailing `# vX.Y.Z` version
#   comment (supply-chain hardening, the issue tracker ("CI and repository hardening")
#   item 3 — a mutable tag like `@v6` can be repointed). Dependabot's github-actions
#   updates bump both the SHA and the comment. Keep new actions pinned the same way.

name: check

on:
  pull_request:
  push:
    branches: [main]
  # Weekly scheduled run (Mon 06:00 UTC): catches toolchain/dependency rot between PRs —
  # a remote action deprecation, an SDK download breaking, a cache going stale — on a repo
  # that can sit quiet for days. workflow_dispatch allows an on-demand full-matrix run.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: build & test · JVM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          # Read-only cache for PR runs; main runs may write fresh entries.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run gradle check
        run: ./gradlew check

      - name: Run cross-reference validator
        run: bash scripts/check-cross-references.sh

      - name: Run markdown link validator
        run: bash scripts/check-markdown-links.sh

  android-compile:
    name: build & test · Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships the Android SDK (ANDROID_SDK_ROOT set) with recent platforms preinstalled
      # — including the compileSdk used here, whose platform directory and sdkmanager package id are
      # `android-36` (API 36, the latest *stable* — ADR-017; unlike the beta API-37 platform, which
      # carries a `.0` revision suffix as `android-37.0`). So this is normally a no-op; the guarded
      # install is only a fallback for a future runner image that drops android-36. Using the
      # preinstalled sdkmanager keeps CI on first-party actions only (no third-party setup-android
      # action on the supply chain). AGP resolves build-tools itself.
      - name: Ensure Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "--- platforms present ---"; ls -1 "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "(none)"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
            # `yes` feeds the license prompts; its broken-pipe on the reader's exit is harmless, hence 2>/dev/null.
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Compiles every module's androidMain (the core modules and mrz-camera-android's ML Kit recognizer
      # + CameraX scanner). Most host tests run in the `check` job via each module's jvm target;
      # mrz-camera-android is Android-only (no jvm target), so its androidHostTest unit tests — the
      # CameraState recoverable/critical classification — run here, where the Android SDK is present.
      # The four source-bearing common modules enable withHostTest{}, so their COMMON test suites also
      # execute against the Android target here (~600 tests on the JVM host with the Android variant) —
      # the Android target is no longer compile-only on CI.
      # verifyMlKitBundledModel asserts ML Kit stays the bundled (offline) text-recognition model — it
      # resolves androidRuntimeClasspath, so it needs the Android SDK this job provides.
      # Still no emulator / instrumented / live-camera tests (those run locally on a device).
      - name: Compile Android targets, run Android host tests, verify ML Kit bundled model
        run: ./gradlew compileAndroidMain :mrz-camera-android:testAndroidHostTest :types:testAndroidHostTest :mrz-core:testAndroidHostTest :telemetry:testAndroidHostTest :mrz-camera-core:testAndroidHostTest :mrz-camera-android:verifyMlKitBundledModel

  ios-compile:
    name: build & test · iOS
    # Apple targets can only be built on macOS (Kotlin/Native links against the Xcode toolchain);
    # a Linux runner cannot build them at all. macos-latest ships a current Xcode, which Konan uses.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Kotlin/Native keeps its toolchain (a bundled LLVM + libffi, ~1.4 GB) and downloaded
      # platform dependencies under ~/.konan. Without this cache every run re-downloads them.
      # The toolchain version tracks the Kotlin version, so the version catalog is the cache key;
      # restore-keys lets a Kotlin bump fall back to the previous toolchain while it re-provisions.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Compiles every module's iOS targets and runs the common host tests on the simulator.
      # iosSimulatorArm64Test compiles + runs (the simulator executes Apple-Silicon test binaries);
      # the iosArm64 (device) target is compile-only here — it cannot execute on an Apple-Silicon
      # runner — but compiling it catches target-specific breaks.
      # assembleTesseraDebugXCFramework links the umbrella SPM artifact (ADR-019) across both iOS
      # slices, so the framework's `export(...)` surface is validated on every PR — a broken export
      # (e.g. a removed api dependency) fails CI here instead of at the release slice. (Debug, not
      # release: same export wiring, faster link; the release variant is built at the 0.2.0 release.)
      # :mrz-camera-ios:checkKotlinAbi validates the iOS-only module's public ABI against its committed
      # api/ baseline here, where the iOS targets actually compile (the ubuntu `check` job only infers
      # iOS targets). The JVM `check` job covers the JVM-bearing modules' common ABI baselines.
      - name: Compile iOS targets, run simulator tests, assemble the XCFramework, check iOS ABI
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 :mrz-camera-ios:assembleTesseraDebugXCFramework :mrz-camera-ios:checkKotlinAbi
