name: Bug report
description: Something the SDK does wrong while parsing, validating, generating, or reading (camera, saved image, chip).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **Never paste data from a real document.** MRZ lines, chip data, and logs from a real read hold personal data (name, document number, birth date). Reproduce the problem with **synthetic data**: the SDK's own generator (`MrzGenerator`) makes valid MRZs, and the ICAO specimen (`ERIKSSON`, Utopia) is safe. Issues with real document data are edited or deleted on sight.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the SDK do, and what did you expect instead?
      placeholder: "parse() returned PartialSuccess with MrzCheckDigitMismatch on a synthetic TD3 that should be clean."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction (synthetic data only)
      description: The smallest input and code that show the problem. Generate the MRZ or use the ICAO specimen; no real documents, no real chip dumps.
      render: kotlin
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "0.5.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - JVM / backend
        - Android
        - iOS (Swift / SPM)
        - Other / multiple
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment (platform versions; device if camera or chip related)
      placeholder: "Android 15 / Pixel 9, minSdk 23, CameraXMrzScanner defaults"
