org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache (Gradle 9.8): the full `check` + publish task graph stores and reuses an entry
# with zero problems (verified 2026-10-10, TES-145); a warm invocation skips configuration entirely.
org.gradle.configuration-cache=true
kotlin.code.style=official

# Lockstep version per ADR-016 — every published module shares this version
version=1.0.1

# Commonized cinterop (TES-320): emrtd-core's OpenSSL bindings are declared per iOS target, and the
# chip crypto backend that calls them lives in the shared iosMain source set. This lets iosMain see
# the bindings (Kotlin Gradle plugin's "cinterop commonization").
kotlin.mpp.enableCInteropCommonization=true
